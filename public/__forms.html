<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form
      action="/__forms.html"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
      method="POST"
      name="jaw-appointment"
    >
      <input name="form-name" type="hidden" value="jaw-appointment" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="zone" />
      <input name="problem" />
      <input name="examination" />
      <input name="service" />
      <input name="consent" />
    </form>
  </body>
</html>
